name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run check
      - run: npm run lint:css
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run build -- --base /6-am-test/
      - run: npm run smoke -- --base /6-am-test/
      - name: Smoke-test production preview
        shell: bash
        run: |
          npm run preview -- --base /6-am-test/ --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/6-am-test/ > /dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat preview.log
              exit 1
            fi
            sleep 0.5
          done

          curl --fail --silent --show-error http://127.0.0.1:4173/6-am-test/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/6-am-test/time.html > /dev/null
